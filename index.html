<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Drill 2 - ICT Academy</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: 'Rubik', sans-serif;">

        <!-- HEADER / NAVBAR -->
    <header class="header">
        <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
            <div class="container">                                        
                <img class="rounded-circle" src="LOGO.png" width="55" height="55" alt="Profile Image">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mynavbar">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="Enroll.html">Enroll</a>
                        </li>
                    </ul>
                    <form class="d-flex">
                        <input class="form-control me-2" type="text" placeholder="Search">
                        <button class="btn btn-primary" type="button">Search</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>

     <!-- CONTACT SECTION -->
    <div class="py-5 position-relative min-vh-100">
        <img src="https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/51bf9a1b-c4fc-42b1-abe6-945af52780da/OBMC+MONTESSORI+AN+1+-+AY+2026+FA.jpg" alt="coding screen" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover">
            <div class="container position-relative">        
                <div class="row g-4 align-items-stretch">
                        <div class="text-right mb-4 fluid">
                            <h1 class="text-center mt-5 text-white">OBMC Student Enrollment Form</h1>                        
                        </div>
                </div>
                    
                    <div class="p-4 p-md-5 bg-dark text-white bg-opacity-75 border rounded ">
                    <fieldset>
                       
                        <!-- NAME -->
                        <div class="row g-3 mb-3">
                            <h1 class="text-start mb-4">Student information</h1>
                            <div class="col-md-6">
                                <input type="text" class="form-control" name="first_name" placeholder="First Name*" required>
                            </div>
                            <div class="col-md-6">
                                <input type="text" class="form-control" name="last_name" placeholder="Last Name*" required>
                            </div>
                        </div>
                    
                        <div class="row g-3 mb-3">
                        <!-- Email -->
                        <div class="col-md-3">
                            <label>Email</label>
                            <input type="email" id="email" class="form-control" name="email" placeholder="Enter your email" placeholder="Email*" required>
                        </div>

                        <!-- Gender-->
                        <div class="col-md-3">
                        <label>Gender</label>
                            <select class="form-select">
                                <option>Gender</option>
                                <option>Male</option>
                                <option>Female</option>
                                <option>Non-binary</option>
                                <option>Other</option>
                            </select>
                        </div>
                        <!-- Birth Date -->
                        <div class="col-md-3">
                            <label>Date of Birth:</label>
                            <br>
                            <input size="100" type="date" min="1900-01-01" max="2026-11-24" required>
                        </div>
                        
                        <!-- Grade level -->
                        <div class="col-md-3">
                            <label>Grade Level:</label>
                            <input type="number" min="1" max="12" placeholder="Enter grade level">
                        </div>

                       
                        <!-- Contact -->
                        <div class="row g-3 mb-3">
                            <h1 class="text-start mb-4">Contact details</h1>
                            <div class="col-md-6">
                            <select class="form-select">
                                <option>Mode of learning</option>
                                <option>Online</option>
                                <option>Face to face</option>
                            </select>
                            </div>
                            <div class="col-md-6">
                                <input type="text" class="form-control" name="last_name" placeholder="Contact number*" required>
                            </div>
                        </div>
                        <!-- ENROLL BUTTON -->
                        <button type="submit" class="btn btn-primary w-100">Send Enrollment</button>
                    </fieldset>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        <footer>©2026 | Jaan Patryk M. Dela Cruz | Q2  Skills test | 9-Emerald</footer>
    </div>

</body>
</html>
